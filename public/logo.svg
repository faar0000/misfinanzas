<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C48C"/>
      <stop offset="100%" stop-color="#00965E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00382B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card / App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Main Logo Mark Group -->
  <g transform="translate(0, -12)" filter="url(#subtleShadow)">
    <!-- House / Speech Bubble Outer Silhouette & Arrow Path -->
    <!-- House Base & Arrow Tip -->
    <path 
      d="M 180 250 L 180 320 L 210 320 L 210 375 L 256 335 L 332 335 L 332 250" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- House Top Roof and Side Wall -->
    <path 
      d="M 180 260 L 180 180 L 256 120 L 332 180 L 332 200" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Growing Arrow and Chart Inside -->
    <!-- Growth Bars -->
    <rect x="238" y="200" width="16" height="50" rx="4" fill="#00B074" opacity="0.9"/>
    <rect x="268" y="170" width="16" height="80" rx="4" fill="#00B074" opacity="0.9"/>

    <!-- Rising Zig-Zag Arrow Breaking Upwards -->
    <path 
      d="M 180 285 L 235 200 L 270 235 L 340 125" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Arrow Head -->
    <polygon points="340,105 358,150 315,135" fill="#00B074"/>

    <!-- Financial Constellation / Neural Nodes Network -->
    <g stroke="#00B074" stroke-width="3.5" opacity="0.85">
      <line x1="200" y1="285" x2="225" y2="265"/>
      <line x1="225" y1="265" x2="265" y2="275"/>
      <line x1="225" y1="265" x2="245" y2="300"/>
      <line x1="265" y1="275" x2="310" y2="280"/>
      <line x1="265" y1="275" x2="295" y2="250"/>
      <line x1="310" y1="280" x2="325" y2="240"/>
    </g>
    <!-- Constellation Node Dots -->
    <circle cx="200" cy="285" r="5.5" fill="#00B074"/>
    <circle cx="225" cy="265" r="6" fill="#00B074"/>
    <circle cx="245" cy="300" r="5" fill="#00B074"/>
    <circle cx="265" cy="275" r="6.5" fill="#00B074"/>
    <circle cx="295" cy="250" r="5.5" fill="#00B074"/>
    <circle cx="310" cy="280" r="6" fill="#00B074"/>
    <circle cx="325" cy="240" r="5" fill="#00B074"/>
  </g>

  <!-- Typography: FINCAUTO -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="3.5">
    <text x="82" y="445" fill="#0A192F">FINC</text>
    <text x="228" y="445" fill="#00B074">AUTO</text>
  </g>
</svg>
