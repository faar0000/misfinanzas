<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00382B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Centered Icon Mark without typography for clean launcher icon -->
  <g transform="translate(0, 15)" filter="url(#subtleShadow)">
    <!-- House / Speech Bubble Outer Outline -->
    <path 
      d="M 160 260 L 160 360 L 205 360 L 205 425 L 265 375 L 352 375 L 352 260" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <path 
      d="M 160 270 L 160 180 L 256 100 L 352 180 L 352 205" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Internal Chart Bars -->
    <rect x="232" y="200" width="20" height="70" rx="5" fill="#00B074" opacity="0.95"/>
    <rect x="272" y="160" width="20" height="110" rx="5" fill="#00B074" opacity="0.95"/>

    <!-- Dynamic Growth Arrow Path -->
    <path 
      d="M 160 310 L 230 200 L 275 245 L 365 105" 
      fill="none" 
      stroke="#00B074" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <polygon points="365,80 390,135 335,120" fill="#00B074"/>

    <!-- Constellation / Network Points -->
    <g stroke="#00B074" stroke-width="4.5" opacity="0.9">
      <line x1="185" y1="310" x2="220" y2="280"/>
      <line x1="220" y1="280" x2="270" y2="295"/>
      <line x1="220" y1="280" x2="245" y2="330"/>
      <line x1="270" y1="295" x2="325" y2="300"/>
      <line x1="270" y1="295" x2="305" y2="265"/>
      <line x1="325" y1="300" x2="340" y2="250"/>
    </g>
    <!-- Constellation Dots -->
    <circle cx="185" cy="310" r="7.5" fill="#00B074"/>
    <circle cx="220" cy="280" r="8" fill="#00B074"/>
    <circle cx="245" cy="330" r="7" fill="#00B074"/>
    <circle cx="270" cy="295" r="8.5" fill="#00B074"/>
    <circle cx="305" cy="265" r="7.5" fill="#00B074"/>
    <circle cx="325" cy="300" r="8" fill="#00B074"/>
    <circle cx="340" cy="250" r="7" fill="#00B074"/>
  </g>
</svg>
